[package]
name = "engramind"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
description = "Rede de memórias para agentes de IA"
publish = false

[lib]
doctest = false

[[bin]]
name = "engramind"
path = "src/main.rs"
test = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
croner = "4"
dirs = "7"
dotenvy = "0.15"
fastembed = { version = "7.5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
hmac = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1.9"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter", "json"] }
unicode-normalization = "0.1.26"
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# SQLite compilado otimizado deixa os testes de banco mais rápidos (D-017).
[profile.dev.package.libsqlite3-sys]
opt-level = 3
